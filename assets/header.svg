<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#171717" stroke-width="1"/>
    </pattern>
    <linearGradient id="signal" x1="70" y1="0" x2="1130" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#202020"/>
      <stop offset="0.2" stop-color="#616161"/>
      <stop offset="0.5" stop-color="#D0D0D0"/>
      <stop offset="0.8" stop-color="#616161"/>
      <stop offset="1" stop-color="#202020"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="terminal">
      <rect x="54" y="38" width="1092" height="244" rx="8"/>
    </clipPath>
  </defs>

  <rect width="1200" height="320" fill="#080808"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <g clip-path="url(#terminal)">
    <rect x="54" y="38" width="1092" height="244" rx="8" fill="#0A0A0A" fill-opacity="0.82"/>
    <rect x="54" y="38" width="1092" height="30" fill="#0D0D0D"/>

    <rect x="-180" y="38" width="180" height="244" fill="url(#scanFade)" opacity="0.08">
      <animate attributeName="x" from="-180" to="1200" dur="7s" repeatCount="indefinite"/>
    </rect>

    <path d="M72 215C130 215 149 177 204 177C262 177 274 233 333 233C393 233 405 151 463 151C522 151 539 223 596 223C654 223 668 165 728 165C789 165 798 204 858 204C919 204 932 181 990 181C1048 181 1076 192 1128 164"
          stroke="#7A7A7A" stroke-opacity="0.14" stroke-width="18" filter="url(#glow)"/>

    <path d="M72 215C130 215 149 177 204 177C262 177 274 233 333 233C393 233 405 151 463 151C522 151 539 223 596 223C654 223 668 165 728 165C789 165 798 204 858 204C919 204 932 181 990 181C1048 181 1076 192 1128 164"
          stroke="url(#signal)" stroke-width="1.4" stroke-dasharray="7 8">
      <animate attributeName="stroke-dashoffset" from="0" to="-120" dur="8s" repeatCount="indefinite"/>
    </path>

    <line x1="54" y1="68" x2="1146" y2="68" stroke="#202020"/>
    <line x1="86" y1="184" x2="1114" y2="184" stroke="#151515"/>

    <circle cx="77" cy="53" r="3" fill="#3D3D3D"/>
    <circle cx="90" cy="53" r="3" fill="#3D3D3D"/>
    <circle cx="103" cy="53" r="3" fill="#3D3D3D"/>

    <text x="122" y="57" fill="#5A5A5A"
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="10" letter-spacing="1.8">
      ~/identity
    </text>

    <text x="86" y="127" fill="#F0F0F0"
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="42" font-weight="600" letter-spacing="-1.2">
      alilbitofsoulsauce
    </text>

    <text x="88" y="158" fill="#717171"
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="13" letter-spacing="2">
      QUIET SYSTEMS / CAREFUL SOFTWARE / REAL-WORLD CONSTRAINTS
    </text>

    <text x="88" y="257" fill="#555555"
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="11" letter-spacing="1.2">
      status:
    </text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
       font-size="11" letter-spacing="1.2" fill="#A0A0A0">
      <text x="140" y="257" opacity="1">learning
        <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.27;0.31;0.94;0.96;0.98;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="140" y="257" opacity="0">building
        <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.30;0.33;0.60;0.64;0.98;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="140" y="257" opacity="0">revising
        <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.62;0.65;0.66;0.68;0.94;1" dur="12s" repeatCount="indefinite"/>
      </text>
    </g>

    <rect x="205" y="247" width="7" height="13" fill="#848484">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <circle cx="204" cy="177" r="3" fill="#D0D0D0">
      <animate attributeName="r" values="2.5;4;2.5" dur="3.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;1;0.55" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="463" cy="151" r="3" fill="#D0D0D0">
      <animate attributeName="r" values="2.5;4;2.5" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;1;0.55" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="728" cy="165" r="3" fill="#D0D0D0">
      <animate attributeName="r" values="2.5;4;2.5" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;1;0.55" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="990" cy="181" r="3" fill="#D0D0D0">
      <animate attributeName="r" values="2.5;4;2.5" dur="4.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;1;0.55" dur="4.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="54.5" y="38.5" width="1091" height="243" rx="7.5" stroke="#252525"/>

  <defs>
    <linearGradient id="scanFade" x1="0" y1="0" x2="180" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
