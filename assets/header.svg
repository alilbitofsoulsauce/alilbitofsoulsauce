<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#141414" stroke-width="1"/>
    </pattern>

    <linearGradient id="signal" x1="70" y1="0" x2="1130" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#222222"/>
      <stop offset="0.2" stop-color="#5D5D5D"/>
      <stop offset="0.5" stop-color="#D2D2D2"/>
      <stop offset="0.8" stop-color="#5D5D5D"/>
      <stop offset="1" stop-color="#222222"/>
    </linearGradient>

    <linearGradient id="scanFade" x1="0" y1="0" x2="210" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <clipPath id="terminal">
      <rect x="50" y="30" width="1100" height="320" rx="10"/>
    </clipPath>
  </defs>

  <rect width="1200" height="380" fill="#070707"/>
  <rect width="1200" height="380" fill="url(#grid)"/>

  <g clip-path="url(#terminal)">
    <rect x="50" y="30" width="1100" height="320" rx="10" fill="#090909" fill-opacity="0.94"/>
    <rect x="50" y="30" width="1100" height="34" fill="#0D0D0D"/>

    <rect x="-220" y="30" width="210" height="320" fill="url(#scanFade)" opacity="0.055">
      <animate attributeName="x" from="-220" to="1210" dur="8s" repeatCount="indefinite"/>
    </rect>

    <line x1="50" y1="64.5" x2="1150" y2="64.5" stroke="#1F1F1F"/>
    <line x1="84" y1="190" x2="1116" y2="190" stroke="#151515"/>

    <circle cx="70" cy="47" r="3" fill="#3D3D3D"/>
    <circle cx="83" cy="47" r="3" fill="#3D3D3D"/>
    <circle cx="96" cy="47" r="3" fill="#3D3D3D"/>

    <text x="118" y="51" fill="#585858"
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="10" letter-spacing="1.8">~/identity</text>

    <text x="84" y="124" fill="#F2F2F2"
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="43" font-weight="600" letter-spacing="-1.1">alilbitofsoulsauce</text>

    <text x="86" y="158" fill="#747474"
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="13" letter-spacing="2.1">QUIET SYSTEMS / CAREFUL SOFTWARE / REAL-WORLD CONSTRAINTS</text>

    <path d="M72 264C132 264 149 224 208 224C269 224 283 294 344 294C407 294 421 211 482 211C543 211 559 287 621 287C683 287 697 231 758 231C820 231 834 270 896 270C957 270 971 246 1032 246C1080 246 1106 251 1128 251"
          stroke="#777777" stroke-opacity="0.12" stroke-width="20" filter="url(#glow)"/>

    <path d="M72 264C132 264 149 224 208 224C269 224 283 294 344 294C407 294 421 211 482 211C543 211 559 287 621 287C683 287 697 231 758 231C820 231 834 270 896 270C957 270 971 246 1032 246C1080 246 1106 251 1128 251"
          stroke="url(#signal)" stroke-width="1.5" stroke-dasharray="7 8">
      <animate attributeName="stroke-dashoffset" from="0" to="-120" dur="8s" repeatCount="indefinite"/>
    </path>

    <g fill="#D6D6D6">
      <circle cx="208" cy="224" r="3"/>
      <circle cx="482" cy="211" r="3"/>
      <circle cx="758" cy="231" r="3"/>
      <circle cx="1032" cy="246" r="3"/>
    </g>

    <g fill="#D6D6D6">
      <circle cx="208" cy="224" r="3" opacity="0.5">
        <animate attributeName="r" values="3;8;3" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0;0.5" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="482" cy="211" r="3" opacity="0.5">
        <animate attributeName="r" values="3;8;3" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0;0.5" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="758" cy="231" r="3" opacity="0.5">
        <animate attributeName="r" values="3;8;3" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0;0.5" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1032" cy="246" r="3" opacity="0.5">
        <animate attributeName="r" values="3;8;3" dur="4.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0;0.5" dur="4.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="84" y="326" fill="#595959"
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="11" letter-spacing="1.2">status:</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
       font-size="11" letter-spacing="1.2" fill="#A7A7A7">
      <text x="136" y="326" opacity="1">learning
        <animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.26;0.30;0.62;0.96;1" dur="10s" repeatCount="indefinite"/>
      </text>
      <text x="136" y="326" opacity="0">building
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.32;0.60;0.64;1" dur="10s" repeatCount="indefinite"/>
      </text>
      <text x="136" y="326" opacity="0">revising
        <animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0;0.62;0.66;0.92;0.96;1" dur="10s" repeatCount="indefinite"/>
      </text>
    </g>

    <rect x="198" y="315" width="7" height="13" fill="#888888">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.05s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="50.5" y="30.5" width="1099" height="319" rx="9.5" stroke="#232323"/>
</svg>
